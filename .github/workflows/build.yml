name: Build Civix APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Virtual Swap Memory
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android Native Files
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Configure Signing and Build Standalone APK
        run: |
          cd android
          chmod +x gradlew
          # Point release build to debug signing key so Gradle outputs an installable APK
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
          ./gradlew assembleRelease --no-daemon

      - name: Upload Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Civix-Standalone-APK
          path: android/app/build/outputs/apk/**/*.apk
